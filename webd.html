<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://i.pinimg.com/1200x/9a/18/6e/9a186eaa4b3a9117f94c42d3e586561c.jpg" style="display: inline-block;width:400px;height:900px;">
    <p style="float:right;width:200px;">This is an example of an image displayed using inline-block style. The image is aligned to the left, while this text is floated to the right side of the image. The inline-block display allows the image to maintain its block-level properties while still being part of the inline flow of the document.</p> 
</body>
</html>
