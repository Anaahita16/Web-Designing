<!DOCTYPE html>
<html>
<head>
<title>School Report Card </title>
<style>
body{
  background-color: pink;
  color: cadetblue;
} 
table, th, td {
  border: 5px solid black;
  border-collapse: collapse;
  padding: 8px;
  text-align: left;
}
.timetable{
  margin: 5px;
}


</style>
</head>
<body>
<div class="marksheet">
<caption>Student Report Card</caption>
<hr style="height: 5px solid;">

<table>
  <thead>
    <tr>
      <th colspan="2">subject/ Max marks</th>
      <th>80</th>
      <th>20</th>
      <th>100</th>
    </tr>
    </thead>
<tbody>
    <tr>
      <td colspan="2">MATHEMATICS</td>
      <td rowspan="2">72</td>
      <td rowspan="2">19</td>
      <td rowspan="2">91</td>
    
    </tr>
    </tbody>
    <tbody>
<tr>
    <td colspan="2">PHYSICS</td>
    <td rowspan="2">71</td>
    <td rowspan="2">20</td>
    <td rowspan="2">81</td>
</tr>
</tbody>
<tbody>
<tr>
    <td colspan="2">CHEMISTRY</td>
    <td rowspan="2">62</td>
    <td rowspan="2">18</td>
    <td rowspan="2">90</td>
</tr>
</table>
</div>
</body>
</html>
